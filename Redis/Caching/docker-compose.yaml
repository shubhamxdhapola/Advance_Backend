services:
  backend:
    build : ./backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongo:27017/caching
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"

  