services:
  nginx:
    image: nginx
    container_name: nginx
    ports:
      - 8080:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - gateway1
      - gateway2
  
  gateway1:
    build: ./backend/gateway
    container_name: gateway1
    ports:
      - 7001:7000
    environment:
      - PORT=7000
      - GATEWAY_NAME=gateway1
    depends_on:
      - auth
      - order
      - product
    
  gateway2:
    build: ./backend/gateway
    container_name: gateway2
    ports:
      - 7002:7000
    environment:
      - PORT=7000
      - GATEWAY_NAME=gateway2
    depends_on:
      - auth
      - order
      - product

  auth:
    build: ./backend/services/auth
    container_name: auth
    ports:
      - 8001:8000
    environment:
      - PORT=8000
  
  order:
    build: ./backend/services/order
    container_name: order
    ports:
      - 8002:8000
    environment:
      - PORT=8000

  product:
    build: ./backend/services/product
    container_name: product
    ports:
      - 8003:8000
    environment:
      - PORT=8000